<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norws-填补信息差，新闻聚合器。</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 顶部导航栏 ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            padding: 0 40px;
            border-bottom: 4px solid #000000;
            background-color: #fff;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo-section {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-icon {
            height: 50px;
            width: auto;
            margin-right: 15px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 800;
            color: #3b4cca;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 22px;
            font-weight: 700;
            color: #3b4cca;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .nav-links a:hover {
            opacity: 0.7;
        }

        .nav-links a.active {
            border-bottom: 3px solid #3b4cca;
            padding-bottom: 4px;
        }

        /* ================= 主体内容区 ================= */
        .main-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1600px;
        }

        .news-box {
            border: 4px solid #000000;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            aspect-ratio: 4 / 3; 
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .news-box:hover {
            transform: translateY(-4px);
            box-shadow: 6px 6px 0px #000000;
        }

        .news-box-inner {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* 图片容器 */
        .news-image-container {
            width: 100%;
            height: 65%;
            position: relative;
            background-color: #e8e8e8;
            border-bottom: 3px solid #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .news-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .news-box .news-title {
            height: 35%;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* ================= 加载更多按钮 ================= */
        .load-more-container {
            margin: 40px 0;
            text-align: center;
            width: 100%;
        }

        .load-more-btn {
            background-color: #3b4cca;
            color: #ffffff;
            font-size: 22px;
            font-weight: 800;
            padding: 15px 40px;
            border: 4px solid #000000;
            cursor: pointer;
            box-shadow: 6px 6px 0px #000000;
            transition: all 0.1s ease;
        }

        .load-more-btn:hover {
            background-color: #2a38a8;
        }

        .load-more-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000000;
        }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #3b4cca;
            padding: 50px 0;
        }

        /* ================= 底部 ================= */
        .footer {
            padding: 10px 40px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fff;
            flex-shrink: 0;
            border-top: 4px solid #000000;
        }

        .copyright {
            font-size: 24px;
            font-weight: 800;
            color: #3b4cca;
            letter-spacing: 1px;
        }

        /* ================= 弹窗 ================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: #ffffff;
            border: 6px solid #000000;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            box-shadow: 10px 10px 0px #3b4cca;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            background-color: #3b4cca;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid #000000;
            flex-shrink: 0;
        }

        .modal-header .title-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80%;
        }

        .modal-close {
            background-color: #ffffff;
            color: #3b4cca;
            border: 3px solid #000000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 2px 2px 0px #000000;
            transition: all 0.1s ease;
            flex-shrink: 0;
        }

        .modal-close:hover {
            background-color: #e0e0e0;
        }
        .modal-close:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .modal-iframe-container {
            flex: 1;
            position: relative;
            background-color: #f5f5f5;
            overflow: hidden;
        }

        .modal-iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .iframe-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            color: #3b4cca;
            background-color: #f5f5f5;
            z-index: 1;
        }

    </style>
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="logo-section">
            <img src="logo.png" alt="Logo" class="logo-icon" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'50\' height=\'50\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'none\' stroke=\'%233b4cca\' stroke-width=\'8\'/><circle cx=\'70\' cy=\'30\' r=\'12\' fill=\'none\' stroke=\'%233b4cca\' stroke-width=\'8\'/></svg>'">
            <span class="logo-text">Norws</span>
        </div>
        <nav class="nav-links" id="platformNav">
            <!-- 平台切换按钮将由 JS 动态生成 -->
        </nav>
    </header>

    <!-- 主体内容 -->
    <main class="main-content">
        <div class="news-grid" id="newsGrid">
            <div class="loading-state">正在获取最新热点，请稍候...</div>
        </div>
        
        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn" style="display: none;">+ 加载更多</button>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="footer">
        <div class="copyright">©NorStudio 2026</div>
    </footer>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="newsModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="title-text" id="modalTitle">正在加载...</span>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-iframe-container">
                <div class="iframe-loading" id="iframeLoading">正在加载原文网页...</div>
                <iframe id="modalIframe" src="" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
            </div>
        </div>
    </div>

    <!-- 核心脚本 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const newsGrid = document.getElementById('newsGrid');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const newsModal = document.getElementById('newsModal');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const modalTitle = document.getElementById('modalTitle');
            const modalIframe = document.getElementById('modalIframe');
            const iframeLoading = document.getElementById('iframeLoading');
            const platformNav = document.getElementById('platformNav');

            // 支持的平台列表
            const PLATFORMS = [
                { code: 'baidu', name: '百度' },
                { code: 'weibo', name: '微博' },
                { code: 'zhihu', name: '知乎' },
                { code: 'vtex', name: 'V2EX' },
                { code: 'hackernews', name: 'HN' },
                { code: 'sspai', name: '少数派' }
            ];

            let currentPlatform = 'baidu';
            let allNewsItems = [];
            let currentIndex = 0;
            const BATCH_SIZE = 15;

            // ============ 构建平台导航 ============
            PLATFORMS.forEach(p => {
                const a = document.createElement('a');
                a.textContent = p.name;
                a.dataset.code = p.code;
                if (p.code === currentPlatform) a.classList.add('active');
                a.addEventListener('click', () => {
                    if (p.code === currentPlatform) return;
                    currentPlatform = p.code;
                    document.querySelectorAll('#platformNav a').forEach(el => el.classList.remove('active'));
                    a.classList.add('active');
                    loadNews();
                });
                platformNav.appendChild(a);
            });

            // ============ 数据过滤函数：剔除无效新闻 ============
            function filterValidNews(items) {
                if (!Array.isArray(items)) return [];
                const seenTitles = new Set();
                return items.filter(item => {
                    // 1. 剔除空数据
                    if (!item) return false;
                    // 2. 剔除无标题或标题为空的
                    if (!item.title || typeof item.title !== 'string' || item.title.trim() === '') return false;
                    // 3. 剔除无有效链接的
                    if (!item.url || typeof item.url !== 'string') return false;
                    if (!item.url.startsWith('http://') && !item.url.startsWith('https://')) return false;
                    // 4. 剔除标题重复的（同一平台内）
                    const normalizedTitle = item.title.trim();
                    if (seenTitles.has(normalizedTitle)) return false;
                    seenTitles.add(normalizedTitle);
                    // 通过所有检查
                    return true;
                });
            }

            // ============ 加载新闻 ============
            function loadNews() {
                newsGrid.innerHTML = '<div class="loading-state">正在获取最新热点，请稍候...</div>';
                loadMoreBtn.style.display = 'none';
                allNewsItems = [];
                currentIndex = 0;

                const apiUrl = `https://news.orz.ai/api/v1/dailynews/?platform=${currentPlatform}`;

                fetch(apiUrl)
                    .then(response => response.json())
                    .then(result => {
                        if (result.status === '200' && Array.isArray(result.data)) {
                            // ★ 关键：过滤无效数据
                            const validItems = filterValidNews(result.data);

                            if (validItems.length > 0) {
                                allNewsItems = validItems;
                                newsGrid.innerHTML = '';
                                loadMoreBtn.style.display = 'inline-block';
                                loadNewsBatch();
                            } else {
                                // 过滤后没有任何有效新闻
                                newsGrid.innerHTML = '<div class="loading-state">该平台暂无有效热点，请切换其他平台。</div>';
                            }
                        } else {
                            throw new Error('该平台暂无数据');
                        }
                    })
                    .catch(error => {
                        console.error('加载新闻失败:', error);
                        newsGrid.innerHTML = `<div class="loading-state" style="color:red;">加载新闻失败：${error.message}。请切换平台或稍后重试。</div>`;
                    });
            }

            // ============ 分批加载 ============
            function loadNewsBatch() {
                loadMoreBtn.disabled = true;
                loadMoreBtn.textContent = '加载中...';

                const batchItems = allNewsItems.slice(currentIndex, currentIndex + BATCH_SIZE);
                currentIndex += BATCH_SIZE;

                if (batchItems.length === 0) {
                    loadMoreBtn.style.display = 'none';
                    return;
                }

                batchItems.forEach((item, index) => {
                    const boxDiv = document.createElement('div');
                    boxDiv.className = 'news-box';
                    boxDiv.dataset.url = item.url;
                    boxDiv.dataset.title = item.title;

                    const innerDiv = document.createElement('div');
                    innerDiv.className = 'news-box-inner';

                    // 图片容器
                    const imageContainer = document.createElement('div');
                    imageContainer.className = 'news-image-container';

                    // 兜底图（基于 URL 种子）
                    const seed = item.url.replace(/[^a-zA-Z0-9]/g, '').slice(-24) || `news_${currentIndex}_${index}`;
                    const fallbackUrl = `https://picsum.photos/seed/${seed}/400/300`;

                    const img = document.createElement('img');
                    img.src = fallbackUrl;
                    img.alt = item.title;
                    imageContainer.appendChild(img);

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'news-title';
                    titleDiv.textContent = item.title;

                    innerDiv.appendChild(imageContainer);
                    innerDiv.appendChild(titleDiv);
                    boxDiv.appendChild(innerDiv);
                    newsGrid.appendChild(boxDiv);

                    // 点击打开弹窗
                    boxDiv.addEventListener('click', () => openModal(item));

                    // 尝试从原文获取图片
                    fetchNewsImage(item.url, img);
                });

                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = '+ 加载更多';
            }

            // ============ 从原文网页获取图片 ============
            function fetchNewsImage(url, imgElement) {
                const metaApi = `https://news.orz.ai/api/v1/tools/website-meta/?url=${encodeURIComponent(url)}`;
                
                fetch(metaApi)
                    .then(res => res.json())
                    .then(result => {
                        let imageUrl = null;

                        if (result.status === '200' && result.data && result.data.meta_info) {
                            const meta = result.data.meta_info;
                            imageUrl = meta['og:image'] || meta['twitter:image'] || null;
                            
                            if (imageUrl && !imageUrl.startsWith('http')) {
                                try {
                                    const urlObj = new URL(url);
                                    imageUrl = `${urlObj.origin}${imageUrl.startsWith('/') ? '' : '/'}${imageUrl}`;
                                } catch (e) {
                                    imageUrl = null;
                                }
                            }
                        }

                        if (imageUrl) {
                            const tempImg = new Image();
                            tempImg.onload = () => { imgElement.src = imageUrl; };
                            tempImg.onerror = () => { /* 保留兜底图 */ };
                            tempImg.src = imageUrl;
                        }
                    })
                    .catch(err => {
                        console.warn('无法获取原文图片，使用兜底图:', url);
                    });
            }

            // ============ 弹窗 ============
            function openModal(item) {
                if (!item.url || !item.url.startsWith('http')) {
                    alert('该新闻没有有效的原文链接。');
                    return;
                }

                modalTitle.textContent = item.title || '新闻详情';
                iframeLoading.style.display = 'flex';
                iframeLoading.textContent = '正在加载原文网页...';

                modalIframe.src = 'about:blank';
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(item.url)}`;
                modalIframe.src = proxyUrl;

                modalIframe.onload = () => {
                    iframeLoading.style.display = 'none';
                };

                newsModal.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                newsModal.classList.remove('active');
                document.body.style.overflow = '';
                modalIframe.src = 'about:blank';
            }

            // ============ 事件监听 ============
            loadMoreBtn.addEventListener('click', loadNewsBatch);
            closeModalBtn.addEventListener('click', closeModal);

            newsModal.addEventListener('click', (e) => {
                if (e.target === newsModal) closeModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && newsModal.classList.contains('active')) {
                    closeModal();
                }
            });

            // ============ 初始化 ============
            loadNews();
        });
    </script>
</body>
</html>
