<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nor 在线地图</title>
    <link rel="icon" type="image/png" href="https://ys-d.ysepan.com/wap/yangrenhyx/Midl9F9jH7C5b99/xc6gA7Kq3gDIETa9ng3iehD1fa8kc/logo.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            height: 64px; padding: 0 28px; border-bottom: 2px solid #000;
            background: #fff; flex-shrink: 0; z-index: 1000;
        }
        .logo-text { font-size: 24px; font-weight: 800; color: #3b4cca; }
        .nav-links { display: flex; gap: 24px; }
        .nav-links a { text-decoration: none; font-size: 18px; font-weight: 700; color: #3b4cca; }

        .map-selector {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 28px; background: #f8f8ff;
            border-bottom: 1px solid #eaeaea; flex-shrink: 0;
        }
        .map-selector label { font-size: 16px; font-weight: 700; color: #3b4cca; }
        .map-selector select {
            font-family: inherit; font-size: 16px; font-weight: 700;
            padding: 8px 14px; border: 2px solid #000; border-radius: 6px;
            background: #fff; cursor: pointer; outline: none; min-width: 180px;
        }
        .map-selector select:focus { border-color: #3b4cca; box-shadow: 2px 2px 0 #3b4cca; }

        .main-content { flex: 1; position: relative; min-height: 0; overflow: hidden; }
        .map-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; }
        .map-container.active { display: block; }
        #tiandituMap { background-color: #f0f0f0; }

        @media (max-width: 768px) {
            .navbar { flex-direction: column; height: auto; padding: 10px 16px; gap: 8px; }
            .logo-text { font-size: 20px; }
            .nav-links { gap: 16px; }
            .nav-links a { font-size: 15px; }
            .map-selector { padding: 8px 16px; gap: 10px; }
            .map-selector label { font-size: 14px; }
            .map-selector select { font-size: 14px; padding: 6px 10px; min-width: 140px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo-section">
            <span class="logo-text">Nor 地图</span>
        </div>
        <nav class="nav-links">
            <a href="#">更多</a>
            <a href="#">发现</a>
            <a href="#">关于</a>
        </nav>
    </header>

    <div class="map-selector">
        <label for="mapSelect">选择地图：</label>
        <select id="mapSelect">
            <option value="tianditu">天地图</option>
            <option value="leaflet">Leaflet</option>
            <option value="maplibre">MapLibre</option>
        </select>
    </div>

    <main class="main-content">
        <div id="tiandituMap" class="map-container active"></div>
        <div id="leafletMap" class="map-container"></div>
        <div id="maplibreMap" class="map-container"></div>
    </main>

    <!-- 1. 天地图 -->
    <script src="https://api.tianditu.gov.cn/api?v=4.0&tk=de89a318d0048054a421933a2bf0d014"></script>
    <!-- 2. Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 3. MapLibre GL -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <!-- 4. maplibre-gl-leaflet 插件 -->
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>

    <script>
    (function () {
        'use strict';

        var CENTER_LNG = 116.397;
        var CENTER_LAT = 39.908;
        var ZOOM = 12;

        var tdtMap = null;
        var leafletMap = null;
        var maplibreMap = null;

        var containers = {
            tianditu: document.getElementById('tiandituMap'),
            leaflet: document.getElementById('leafletMap'),
            maplibre: document.getElementById('maplibreMap')
        };

        // ===================== 天地图 =====================
        function initTianditu() {
            if (tdtMap) return;
            if (typeof T === 'undefined') {
                containers.tianditu.innerHTML = '<p style="padding:20px;color:#c00;">天地图 API 未加载。</p>';
                return;
            }
            try {
                tdtMap = new T.Map('tiandituMap');
                tdtMap.centerAndZoom(new T.LngLat(CENTER_LNG, CENTER_LAT), ZOOM);
                tdtMap.enableScrollWheelZoom();

                var zoomCtrl = new T.Control.Zoom();
                zoomCtrl.setPosition(T_ANCHOR_TOP_LEFT);
                tdtMap.addControl(zoomCtrl);

                var scaleCtrl = new T.Control.Scale();
                scaleCtrl.setPosition(T_ANCHOR_BOTTOM_LEFT);
                tdtMap.addControl(scaleCtrl);

                var typeCtrl = new T.Control.MapType();
                typeCtrl.setPosition(T_ANCHOR_TOP_RIGHT);
                tdtMap.addControl(typeCtrl);
            } catch (e) {
                console.error('天地图初始化异常：', e);
            }
        }

        // ===================== Leaflet =====================
        function initLeaflet() {
            if (leafletMap) return;
            if (typeof L === 'undefined') {
                containers.leaflet.innerHTML = '<p style="padding:20px;color:#c00;">Leaflet 未加载。</p>';
                return;
            }
            if (typeof L.maplibreGL === 'undefined') {
                containers.leaflet.innerHTML = '<p style="padding:20px;color:#c00;">maplibre-gl-leaflet 插件未加载。</p>';
                return;
            }
            try {
                leafletMap = L.map('leafletMap', {
                    center: [CENTER_LAT, CENTER_LNG],
                    zoom: ZOOM,
                    zoomControl: true
                });

                L.maplibreGL({
                    style: 'https://tiles.openfreemap.org/styles/liberty'
                }).addTo(leafletMap);

                setTimeout(function () { leafletMap.invalidateSize(); }, 100);
            } catch (e) {
                console.error('Leaflet 初始化异常：', e);
            }
        }

        // ===================== MapLibre =====================
        function initMapLibre() {
            if (maplibreMap) return;
            if (typeof maplibregl === 'undefined') {
                containers.maplibre.innerHTML = '<p style="padding:20px;color:#c00;">MapLibre GL 未加载。</p>';
                return;
            }
            try {
                maplibreMap = new maplibregl.Map({
                    container: 'maplibreMap',
                    style: 'https://tiles.openfreemap.org/styles/liberty',
                    center: [CENTER_LNG, CENTER_LAT],
                    zoom: ZOOM
                });

                maplibreMap.addControl(new maplibregl.NavigationControl(), 'top-left');

                setTimeout(function () { maplibreMap.resize(); }, 100);
            } catch (e) {
                console.error('MapLibre 初始化异常：', e);
            }
        }

        // ===================== 切换 =====================
        function switchMap(name) {
            Object.keys(containers).forEach(function (k) {
                containers[k].classList.remove('active');
            });
            containers[name].classList.add('active');

            setTimeout(function () {
                if (name === 'tianditu') {
                    initTianditu();
                } else if (name === 'leaflet') {
                    if (!leafletMap) initLeaflet();
                    else leafletMap.invalidateSize();
                } else if (name === 'maplibre') {
                    if (!maplibreMap) initMapLibre();
                    else maplibreMap.resize();
                }
            }, 60);
        }

        // ===================== 根据浏览器语言选择默认地图 =====================
        function getDefaultMap() {
            var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
            if (lang.startsWith('zh')) {
                return 'tianditu';
            }
            return 'maplibre';
        }

        // ===================== 初始化 =====================
        document.getElementById('mapSelect').addEventListener('change', function () {
            switchMap(this.value);
        });

        window.addEventListener('load', function () {
            var defaultMap = getDefaultMap();
            document.getElementById('mapSelect').value = defaultMap;
            switchMap(defaultMap);
        });

        window.addEventListener('resize', function () {
            var active = document.querySelector('.map-container.active');
            if (!active) return;
            if (active.id === 'leafletMap' && leafletMap) leafletMap.invalidateSize();
            else if (active.id === 'maplibreMap' && maplibreMap) maplibreMap.resize();
        });

    })();
    </script>

</body>
</html>
